# Test-only overrides, layered on top of src/main/resources/application.yml via
# the spring.config.import declared there.
#
# Nothing else is restated, and that is the point: LedgerTimeoutsTest asserts the
# connect and read timeouts, and it is only worth anything if the values it reads
# are the ones that ship. A test config file that redefined them would turn that
# test into a tautology.
#
# Kafka is switched off by default here rather than pointed at a broker. Almost
# every test in this module is about HTTP translation, validation or the saga's
# local state machine, and none of those need one. Leaving the listener enabled
# would mean each of those contexts starts a consumer that spends the test
# retrying a connection to nothing, filling the log with failures nobody is
# looking for.
#
# The tests that do need a broker turn these back on themselves, next to the
# Redpanda container they declare -- so the requirement is visible in the test
# that has it.
spring:
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false

spademoney:
  saga:
    # The driver's trigger is off. Tests call SagaDriver.runOnce() so they can
    # assert on the state BETWEEN steps -- "the hold exists and the capture has
    # not run yet" is the interesting state, and a background thread would race
    # every assertion about it.
    enabled: false
    # No jitter window worth speaking of, so a retry scheduled by one tick is
    # due by the next one and tests do not have to sleep through a backoff.
    # Small budgets so the exhaustion tests do not have to drive dozens of ticks.
    # The asymmetry between the two is what the tests care about, not the sizes.
    max-attempts: 5
    compensation-max-attempts: 12
    base-backoff: PT0.001S
    max-backoff: PT0.005S
  reconciliation:
    # Driven directly by its test. A background run making HTTP calls to a
    # MockRestServiceServer that a test is mid-way through scripting would fail
    # unrelated assertions in ways that look like flakes.
    enabled: false
