spring:
  application:
    name: payments

  datasource:
    # Its own database, in the same Postgres instance as the Ledger's.
    #
    # Two databases rather than two schemas is the point: Postgres offers no
    # cross-database transaction without PREPARE TRANSACTION, so "just wrap both
    # writes in one transaction" is not merely discouraged here, it is
    # unavailable. The impossibility of a distributed transaction across this
    # seam is enforced by the engine instead of by discipline.
    #
    # One container for both is a laptop concession: they share a failure
    # domain. That does not weaken the Session 12 chaos test, which kills
    # application containers, not the database.
    url: jdbc:postgresql://localhost:5432/payments
    username: spademoney
    password: spademoney

  flyway:
    enabled: true

  # Layers an optional overrides file on top of everything below. The file does
  # not exist in the packaged jar; it exists only on the TEST classpath.
  #
  # This is here because the obvious alternative is a trap. A file named
  # application.yml under src/test/resources does not merge with this one, it
  # REPLACES it -- same classpath resource name, test-classes first -- so every
  # value here silently vanishes in tests. That is how a test asserting the HTTP
  # timeouts ends up asserting a value the test's own config file supplied,
  # proving nothing about the configuration that actually ships.
  #
  # An import keeps this file loaded and lets the test file override only what
  # it needs to.
  config:
    import: "optional:classpath:/application-test-overrides.yml"

  kafka:
    # Overridden by compose to redpanda:9092.
    bootstrap-servers: localhost:19092
    consumer:
      group-id: payments
      # earliest, not latest. A consumer group that starts at the end silently
      # skips everything published before it first connected -- which on a fresh
      # `compose up`, or after this service is rebuilt, is exactly the events it
      # most needs. The inbox makes re-reading old events free, so there is no
      # reason to risk missing any.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Offsets are committed by the container after the listener returns, not
      # on a timer. With auto-commit a periodic commit can land in the middle of
      # processing, so a crash would skip an event that was never applied --
      # at-most-once, silently.
      enable-auto-commit: false
    listener:
      # Commit the offset after each record's local transaction has committed.
      # The two commits are still separate systems, so a crash between them
      # redelivers -- that is the at-least-once the inbox is built to absorb,
      # and it is the safe side of the trade.
      ack-mode: record
    producer:
      # Used only by the dead-letter publisher. Payments puts nothing on the
      # domain stream.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  http:
    clients:
      # The Ledger client's timeouts. Not decoration -- Spring's default is
      # effectively "wait forever", which turns a killed Ledger into a hung
      # request instead of a 504 with a name. See LedgerClientConfig for why
      # they live in configuration rather than in code, and LedgerTimeoutsTest
      # for the assertion that keeps them here.
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Health only. The compose healthcheck and the Session 12 chaos script
        # need one machine-readable "is it back yet" signal, not a management
        # surface.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spademoney:
  ledger:
    # Overridden by compose to http://ledger:8080.
    base-url: http://localhost:8080
    # The Ledger publishes here; Payments only reads. The name is the Ledger's
    # to choose, which is why it is configuration rather than a constant.
    events-topic: spademoney.ledger.events

  reconciliation:
    enabled: true
    interval: PT1M
    # How long a saga may sit without advancing before it counts as stuck. Must
    # exceed the driver's whole retry schedule, or a payment legitimately backing
    # off would be reported as stuck every time the Ledger hiccuped.
    stuck-after: PT2M
    # The cross-service checks make one HTTP call per sampled saga, so the sample
    # is bounded: an unbounded diagnostic is an outage waiting for a busy day.
    remote-sample: 50

  saga:
    # The driver's trigger. The bean exists either way, so tests advance a saga
    # one step at a time instead of racing a background thread.
    enabled: true
    # Also the latency of a payment's first step: there is no synchronous start
    # path, deliberately, so that recovery and the happy path are the same code.
    interval: PT0.25S
    batch-size: 20
    # Comfortably longer than one step's worst case (the 5s ledger read timeout),
    # so an in-flight step is never double-driven under normal operation. It is a
    # safety net for a crashed driver, not part of ordinary flow.
    lease: PT30S
    # Forward steps: bounded, because "declined" is an acceptable answer and a
    # payment that never resolves is not. Comfortably longer than a ledger
    # restart, so an ordinary deploy does not decline anything.
    max-attempts: 8
    # Compensations: far more persistent, because there is no acceptable
    # alternative to releasing the payer's funds. Escalation to a human is the
    # last resort, not the first timeout.
    compensation-max-attempts: 50
    base-backoff: PT0.2S
    max-backoff: PT10S
    # Must outlast the whole retry schedule with room to spare: a hold that
    # lapses mid-saga fails the capture for a reason nothing in Payments did.
    hold-expiry: PT10M
