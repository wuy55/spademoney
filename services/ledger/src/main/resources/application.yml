# Merged from the old application.yml + application.yaml pair. Boot loads both
# extensions and silently merges them, which is a good way to spend an evening
# wondering where a property came from. One file, one place to look.
spring:
  application:
    name: ledger

  datasource:
    # Moved from the `spademoney` database to `ledger` in M3: the Ledger and
    # Payments now hold separate databases in the same Postgres instance, so
    # that no transaction can span the two. Migrations are unchanged.
    url: jdbc:postgresql://localhost:5432/ledger
    username: spademoney
    password: spademoney

  flyway:
    enabled: true

  kafka:
    # Overridden by compose to redpanda:9092.
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: the leader answers only once every in-sync replica has the
      # record. With acks=1 a leader failover right after the ack loses an
      # acknowledged event -- and the relay would already have marked it
      # published, so it would never be sent again. That is exactly the silent
      # loss the outbox exists to prevent, reintroduced one config line lower.
      acks: all
      properties:
        # The producer's own dedupe: a retried send that the broker already
        # wrote is recognised by sequence number instead of appended twice.
        # This removes duplicates caused by producer retries; it does NOT make
        # the pipeline exactly-once, because the relay can still crash between
        # the ack and the published_at update. That remaining duplicate is the
        # consumer's inbox's problem, by design.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

management:
  endpoints:
    web:
      exposure:
        # Health only -- the compose healthcheck and the Session 12 chaos script
        # need a machine-readable "the Ledger is back" signal. Retrofitting that
        # later, while debugging a kill script, is miserable.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spademoney:
  outbox:
    relay:
      # The trigger. The relay bean exists either way, so tests drive it a tick
      # at a time instead of racing a background thread.
      enabled: true
      interval: PT1S
      batch-size: 100
      topic: spademoney.ledger.events
      send-timeout: 10s

  holds:
    sweeper:
      # Housekeeping only -- correctness comes from the expires_at predicate,
      # not from this job. Safe to disable or pause.
      enabled: true
      interval: PT1M
      batch-size: 500
