# Shadows src/main/resources/application.yml on the test classpath.
#
# The datasource is not restated on purpose: Testcontainers supplies it through
# @ServiceConnection, and Flyway is enabled by default.
#
# Both background TRIGGERS are off here, for the same reason in both cases: the
# bean stays present and the test drives it explicitly, so an assertion about
# "the state between ticks" is a fact rather than a race.
#
#   - The sweeper: expiry correctness comes from the `expires_at > now()`
#     predicate, not from the job, so the tests that prove it need a lapsed hold
#     sitting there still marked ACTIVE. HoldExpirySweeperTest drives it.
#   - The outbox relay: the assertions that prove an event committed WITH the
#     money look at unpublished outbox rows. A background thread draining them
#     mid-test would make exactly those assertions flaky. OutboxRelayTest drives
#     drainOnce() directly.
spademoney:
  holds:
    sweeper:
      enabled: false
  outbox:
    relay:
      enabled: false

spring:
  kafka:
    admin:
      # Off for the suite: with no broker running, KafkaAdmin logs a full stack
      # trace on every context start. That is noise about a non-problem -- the
      # relay's trigger is disabled here, so nothing tries to publish anyway.
      # OutboxRelayIntegrationTest turns it back on, because there it has a real
      # broker and the declared partition count is part of what it proves.
      auto-create: false
