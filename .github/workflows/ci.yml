name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # One reactor build from the root, not two per-service builds. Both
      # modules inherit their versions from the root pom, so building them
      # separately would let a change to that pom pass CI while breaking the
      # other service. Testcontainers uses the runner's Docker daemon, which
      # ubuntu-latest provides.
      - name: Build and test
        run: ./mvnw --batch-mode verify
